<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="DeepSeek Code app icon">
  <defs>
    <linearGradient id="bg" x1="128" y1="64" x2="896" y2="960" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0a1f44"/>
      <stop offset="0.45" stop-color="#1e3a6e"/>
      <stop offset="1" stop-color="#0b52c8"/>
    </linearGradient>
    <radialGradient id="glow" cx="30%" cy="18%" r="65%">
      <stop offset="0" stop-color="#06b6d4" stop-opacity="0.28"/>
      <stop offset="0.45" stop-color="#2563eb" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#0a1f44" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="body" x1="220" y1="340" x2="760" y2="720" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="0.45" stop-color="#1d4ed8"/>
      <stop offset="1" stop-color="#0a3a8e"/>
    </linearGradient>
    <linearGradient id="belly" x1="290" y1="570" x2="680" y2="750" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e0f2fe"/>
      <stop offset="0.5" stop-color="#7dd3fc"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="accent" x1="400" y1="300" x2="700" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#06b6d4"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-24%" width="140%" height="150%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="28" stdDeviation="24" flood-color="#041838" flood-opacity="0.42"/>
    </filter>
    <filter id="glowFilter" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1024" height="1024" rx="220" fill="url(#bg)"/>
  <rect width="1024" height="1024" rx="220" fill="url(#glow)"/>

  <!-- subtle grid pattern -->
  <g opacity="0.04">
    <line x1="0" y1="256" x2="1024" y2="256" stroke="#ffffff" stroke-width="1"/>
    <line x1="0" y1="512" x2="1024" y2="512" stroke="#ffffff" stroke-width="1"/>
    <line x1="0" y1="768" x2="1024" y2="768" stroke="#ffffff" stroke-width="1"/>
    <line x1="256" y1="0" x2="256" y2="1024" stroke="#ffffff" stroke-width="1"/>
    <line x1="512" y1="0" x2="512" y2="1024" stroke="#ffffff" stroke-width="1"/>
    <line x1="768" y1="0" x2="768" y2="1024" stroke="#ffffff" stroke-width="1"/>
  </g>

  <!-- water/wave lines -->
  <path d="M140 780c100 42 200 58 340 58 160 0 260-36 380-36" fill="none" stroke="#38bdf8" stroke-width="28" stroke-linecap="round" opacity="0.35"/>
  <path d="M180 840c88 28 180 42 290 42 130 0 230-26 350-38" fill="none" stroke="#1e40af" stroke-width="26" stroke-linecap="round" opacity="0.22"/>

  <g filter="url(#shadow)">
    <!-- tail -->
    <path d="M740 490c62-90 140-130 218-98-58 40-90 94-106 152-42-12-80-30-112-54Z" fill="#2563eb"/>
    <path d="M748 600c78 22 138 76 170 154-78-6-136-40-178-102 4-18 6-35 6-52Z" fill="#1e40af"/>

    <!-- main body -->
    <path d="M155 568c15-136 140-226 330-226 128 0 230 38 298 104 70 68 72 162 8 226-82 80-246 100-402 54-134-42-220-100-226-156Z" fill="url(#body)"/>
    <path d="M185 576c58 62 162 106 298 121 108 12 208-4 284-44-60 82-198 126-354 98-128-22-224-80-256-148 0-11 2-20 5-30Z" fill="url(#belly)" opacity="0.96"/>

    <!-- body detail lines -->
    <path d="M470 606c50 52 54 116 10 182-30-76-68-126-120-152 33-10 69-20 110-30Z" fill="#0c4a6e" opacity="0.85"/>
    <path d="M280 600c94 38 230 60 376 34" fill="none" stroke="#60a5fa" stroke-width="20" stroke-linecap="round" opacity="0.30"/>
    <path d="M296 652c68 24 160 38 258 36" fill="none" stroke="#1d4ed8" stroke-width="14" stroke-linecap="round" opacity="0.20"/>

    <!-- eye -->
    <circle cx="310" cy="502" r="22" fill="#041838"/>
    <circle cx="318" cy="494" r="7" fill="#38bdf8"/>

    <!-- mouth line -->
    <path d="M215 556c38 32 84 46 138 46" fill="none" stroke="#041838" stroke-width="16" stroke-linecap="round" opacity="0.26"/>
  </g>

  <!-- code brackets (CSS-style) floating near whale -->
  <g filter="url(#glowFilter)" opacity="0.78">
    <path d="M595 355h-18l-14 28 14 28h18" fill="none" stroke="#06b6d4" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M670 355h18l14 28-14 28h-18" fill="none" stroke="#06b6d4" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- spout/splash -->
  <path d="M380 320c-36-52-10-92 44-106" fill="none" stroke="#38bdf8" stroke-width="22" stroke-linecap="round" opacity="0.72"/>
  <path d="M430 314c-12-52 15-84 62-92" fill="none" stroke="#38bdf8" stroke-width="18" stroke-linecap="round" opacity="0.60"/>
  <path d="M352 340c-52-22-66-60-44-98" fill="none" stroke="#38bdf8" stroke-width="16" stroke-linecap="round" opacity="0.50"/>

  <!-- small dots for accent -->
  <circle cx="700" cy="440" r="4" fill="#06b6d4" opacity="0.5"/>
  <circle cx="730" cy="420" r="2.5" fill="#38bdf8" opacity="0.4"/>
  <circle cx="680" cy="460" r="2" fill="#06b6d4" opacity="0.3"/>
</svg>